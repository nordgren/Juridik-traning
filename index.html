<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juridik inför provet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f6f9;--surface:#ffffff;--ink:#172036;--muted:#596276;--line:#d9dee8;
  --blue:#24427c;--blue-soft:#e7ecf6;--red:#cc2238;--mark:rgba(220,36,58,.22);
  --ok:#1d7448;--ok-soft:#e1f2e8;--bad:#ad2a22;--bad-soft:#fae6e3;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10151e;--surface:#18202c;--ink:#e7eaf1;--muted:#9ba4b6;--line:#2b3546;
  --blue:#93b2ec;--blue-soft:#1e2a42;--red:#ff6b7c;--mark:rgba(255,92,112,.30);
  --ok:#62cb94;--ok-soft:#163226;--bad:#ff8b80;--bad-soft:#3a1d1c;}}
:root[data-theme="dark"]{
  --paper:#10151e;--surface:#18202c;--ink:#e7eaf1;--muted:#9ba4b6;--line:#2b3546;
  --blue:#93b2ec;--blue-soft:#1e2a42;--red:#ff6b7c;--mark:rgba(255,92,112,.30);
  --ok:#62cb94;--ok-soft:#163226;--bad:#ff8b80;--bad-soft:#3a1d1c;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 64px}
header{padding:28px 0 8px;display:flex;gap:16px;align-items:center}
.para{font:700 64px/0.8 var(--serif);color:var(--red);flex:none;margin-top:-4px}
h1{font:700 clamp(26px,5vw,34px)/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:15px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);margin:12px -18px 20px;padding:10px 18px;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;color:var(--muted);font:700 15px var(--sans);padding:8px 12px;border-radius:999px;cursor:pointer}
nav button[aria-current="true"]{background:var(--ink);color:var(--paper)}
h2{font:700 26px/1.2 var(--serif);margin:4px 0 14px}
h3{font:700 19px/1.3 var(--serif);margin:26px 0 8px}
p{margin:0 0 12px;max-width:68ch}
.muted{color:var(--muted)}
.hl{font-weight:700;background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:15px var(--sans);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}
.btn{border:0;background:var(--blue);color:var(--paper);font:700 16px var(--sans);padding:11px 18px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.small{padding:7px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px;margin-bottom:16px}
.tip{border-left:4px solid var(--red);background:var(--surface);padding:12px 16px;border-radius:0 10px 10px 0;margin:18px 0}
.tip strong{color:var(--red)}
ul.plain{padding-left:20px;margin:0 0 12px}ul.plain li{margin-bottom:6px}
textarea{width:100%;min-height:90px;font:16px/1.5 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
select{font:16px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:100%}
label.check{display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer}
label.check input{margin-top:5px;width:18px;height:18px;accent-color:var(--ok)}
/* overview */
.topic{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--ink);font:16px var(--sans)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.pct{font-size:13px;color:var(--muted);text-align:right;margin-top:3px}
/* flashcard */
.card{width:100%;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;cursor:pointer;color:var(--ink);font:inherit;margin-bottom:14px}
.card .term{font:700 clamp(26px,6vw,36px)/1.2 var(--serif)}
.card .term span{background:linear-gradient(transparent 60%,var(--mark) 60%)}
.card .def{font-size:18px;max-width:52ch}
.card .ex{color:var(--muted);font-size:15px;margin-top:10px}
.badge{font-size:13px;font-weight:700;color:var(--red);margin-bottom:10px}
.card .hint{color:var(--muted);font-size:14px;margin-top:16px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px var(--sans);padding:12px 6px;border-radius:10px;cursor:pointer}
.rate .r0{border-color:var(--bad);color:var(--bad)}.rate .r2{border-color:var(--ok);color:var(--ok)}
/* quiz */
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:16px/1.4 var(--sans);padding:12px 14px;border-radius:10px;margin-bottom:8px;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{padding:12px 14px;border-radius:10px;background:var(--blue-soft);margin:6px 0 14px}
.progress{height:4px;background:var(--line);border-radius:2px;margin-bottom:16px}.progress i{display:block;height:100%;background:var(--red);border-radius:2px}
/* sort */
.ord{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.ord .n{font:700 15px var(--serif);color:var(--muted);width:22px}
.ord span.t{flex:1}
.ord button{border:1px solid var(--line);background:var(--paper);color:var(--ink);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px}
.ord.right,.tok.right{border-color:var(--ok);background:var(--ok-soft)}
.ord.wrong,.tok.wrong{border-color:var(--bad);background:var(--bad-soft)}
.pool{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;margin-bottom:14px}
.tok{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:15px var(--sans);padding:7px 11px;border-radius:8px;cursor:pointer;text-align:left}
.tok.sel{border-color:var(--red);box-shadow:0 0 0 2px var(--mark)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.bucket{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;min-height:110px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bucket.target{border-color:var(--red)}
.bucket b{font:700 16px var(--serif)}
.match{display:grid;grid-template-columns:1fr;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.match.right select{border-color:var(--ok);background:var(--ok-soft)}.match.wrong select{border-color:var(--bad);background:var(--bad-soft)}
.list button.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;color:var(--ink);font:16px var(--sans)}
.list .item small{display:block;color:var(--muted)}
/* irac */
.irac{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 18px}
.irac b{font:700 30px/1 var(--serif);color:var(--red)}
.step{margin-bottom:18px}
.step .lbl{font:700 17px var(--serif);margin-bottom:6px}
.model{display:none;margin-top:8px;padding:10px 14px;background:var(--blue-soft);border-radius:10px}
.show .model{display:block}
.case{font-size:17px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:18px}
table{border-collapse:collapse;width:100%;margin:10px 0 16px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.big{font:700 54px/1 var(--serif)}
footer{color:var(--muted);font-size:14px;margin-top:40px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .25s}.card:active{transform:scale(.99)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="para" aria-hidden="true">§</div>
  <div><h1>Juridik inför provet</h1><p class="sub">Elsas träning: läs, öva begrepp, testa dig.</p></div>
</header>
<nav id="nav" aria-label="Lägen"></nav>
<main id="view"></main>
<footer>Sidorna 14, 16–23 och 36–37 följer bokens formuleringar. Övrigt bygger på allmän svensk juridik.</footer>
</div>

<script>
/* ===================== INNEHÅLL ===================== */
const TOPICS=[
{id:"begrepp",name:"Viktiga begrepp"},
{id:"grundlagar",name:"Grundlagarna"},
{id:"rattsstat",name:"Rättsstatens principer"},
{id:"hierarki",name:"Rättsordning och hierarki"},
{id:"styrning",name:"Hur Sverige styrs"},
{id:"rattigheter",name:"Fri- och rättigheter"},
{id:"lagstiftning",name:"Lagstiftningsprocessen"},
{id:"tvingande",name:"Tvingande och dispositiva lagar"},
{id:"allmanna",name:"Allmänna domstolar"},
{id:"forvaltning",name:"Förvaltningsdomstolar"},
{id:"norm",name:"Norm eller lag"},
{id:"rattssakerhet",name:"Rättsmedvetande och rättssäkerhet"},
{id:"irac",name:"Juridisk metod: IRAC"},
{id:"rattskallor",name:"Rättskällor"}
];

const READ={
grundlagar:{p:[
"Sverige har fyra grundlagar: <span class=hl>regeringsformen (RF)</span>, <span class=hl>successionsordningen (SO)</span>, <span class=hl>tryckfrihetsförordningen (TF)</span> och <span class=hl>yttrandefrihetsgrundlagen (YGL)</span>. De står högst i rättsordningen. Ingen annan lag får strida mot dem.",
"<b>RF</b> är den viktigaste. Den slår fast att all offentlig makt utgår från folket och beskriver hur riksdag, regering, domstolar och myndigheter fungerar. I kapitel 2 finns våra grundläggande fri- och rättigheter.",
"<b>SO</b> reglerar tronföljden, alltså vem som blir kung eller drottning. <b>TF</b> skyddar det tryckta ordet och innehåller <span class=hl>offentlighetsprincipen</span>: rätten att ta del av allmänna handlingar. <b>YGL</b> skyddar yttrandefriheten i radio, tv, film, webbplatser och liknande medier.",
"<b>Så ändras en grundlag:</b> Riksdagen måste fatta två <span class=hl>likalydande beslut</span> med ett allmänt riksdagsval emellan. Det ska gå minst nio månader från att förslaget lämnas in till valet. Det första beslutet kallas vilande. Efter valet röstar den nyvalda riksdagen igen.",
"Det går också att hålla en <b>folkomröstning</b> om ett grundlagsförslag, samtidigt med valet. Det har än så länge aldrig skett. Röstar en majoritet nej faller förslaget.",
"<b>Varför är det svårt?</b> Grundlagarna skyddar demokratin och våra rättigheter. Kravet på två beslut med val emellan gör att en tillfällig majoritet inte snabbt kan avskaffa till exempel fria val eller yttrandefriheten. Medborgarna får möjlighet att rösta för eller emot förändringen i riksdagsvalet, och det blir tid för debatt och eftertanke.",
"<b>Riksdagsordningen (RO)</b> innehåller regler om riksdagens arbete. Den är inte en grundlag men har högre rang än en vanlig lag, ett mellanting mellan grundlag och lag."],
tip:"Kunna de fyra grundlagarna med förkortning, vad var och en handlar om, och regeln om två likalydande beslut med val emellan, samt varför."},
rattsstat:{p:[
"En <span class=hl>rättsstat</span> är ett land där makten utövas enligt lagar som gäller för alla, även för dem som styr. Rättsstatens viktigaste principer:",
"<span class=hl>Legalitetsprincipen</span>: ”inget straff utan lag och inget brott utan lag”. Ingen får dömas utan stöd i en lag. Den offentliga makten utövas under lagarna (RF 1 kap. 1 §).",
"<b>Likhet inför lagen</b> (RF 1 kap. 9 §): domstolar och myndigheter ska beakta allas likhet inför lagen och vara sakliga och opartiska.",
"<span class=hl>Likhetsprincipen</span>: myndigheter som Arbetsförmedlingen, Försäkringskassan och socialtjänsten ska behandla alla lika, oavsett vem man är, nationalitet, utbildning eller inkomst. Exempel: alla som uppfyller lagens krav har rätt till sjukpenning, och alla sjuka ska få vård oavsett om de är rika eller fattiga.",
"<span class=hl>Objektivitetsprincipen</span>: alla som arbetar på myndigheter ska vara sakliga och opartiska. De får inte ”tycka” något eller ta egen ställning, utan ska bara ta hänsyn till det som har betydelse för ärendet och följa reglerna.",
"<span class=hl>Maktdelning</span>: makten delas mellan riksdagen (lagstiftande), regeringen (verkställande) och domstolarna (dömande), så att ingen får all makt.",
"<b>Oberoende domstolar</b>: ingen, inte ens regeringen eller riksdagen, får bestämma hur en domstol ska döma i ett enskilt fall.",
"<span class=hl>Rättssäkerhet</span>: lagar ska vara tydliga, offentliga och förutsebara. Man har rätt till en rättvis rättegång, till försvar och att överklaga. Offentlighet och fri press gör att makten kan granskas.",
"<b>Bokens exempel (s. 23):</b> I Danmark har straffen skärpts för brott i vissa bostadsområden som kallas ”getton”. I Sverige skulle sådana beslut strida mot principen om allas likhet inför lagen.",
"<b>Betydelse:</b> Principerna skyddar den enskilda människan mot godtycke och maktmissbruk. Samma regler gäller alla, och man kan förutse vad som händer. Det skapar förtroende och gör att människor följer lagarna."],
tip:"Kunna förklara likhetsprincipen och objektivitetsprincipen med bokens exempel, och varför principerna gör rättsstaten trygg för alla."},
hierarki:{p:[
"För att ett samhälle ska fungera behövs, förutom sociala och moraliska regler, ett <span class=hl>rättssystem</span>. Det består av lagar och andra regler som medborgarna är skyldiga att följa, så kallade <span class=hl>rättsregler</span>. Bryter man mot en rättsregel kan man drabbas av en <span class=hl>sanktion</span>, det vi kallar straff, till exempel böter, fängelse eller indraget körkort.",
"Rättsreglerna beslutas i riksdagen och kallas i dagligt tal för lagar. De är <b>nedskrivna</b>, vilket gör det lättare att ta del av dem och veta vad de innebär.",
"Systemet med rättsregler kallas <span class=hl>rättsordningen</span>. Reglerna har olika hög dignitet, alltså väger olika tungt. Ordningen kallas <span class=hl>normhierarkin</span>: en regel får inte strida mot en regel högre upp. En lag får till exempel inte strida mot grundlagarna.",
"<b>Den svenska rättsordningen (bokens bild, s. 14):</b><br>1. <b>Grundlagar</b> (RF 8 kap. 14 §)<br>2. <b>Riksdagsordningen</b> (RF 8 kap. 17 §)<br>3. <b>Lagar</b><br>4. <b>Förordningar</b> (RF 8 kap. 7 §)<br>5. <b>Föreskrifter</b> (enligt bemyndigande)",
"Lagar och förordningar kallas tillsammans <span class=hl>författningar</span>. Föreskrifter kan vara anvisningar från myndigheter eller lokala ordningsregler som kommunfullmäktige beslutar.",
"Riksdagen beslutar lagar, regeringen beslutar förordningar och myndigheter eller kommuner beslutar föreskrifter."],
tip:"Kunna de fem nivåerna i rätt ordning, att lag + förordning = författningar, och vad normhierarkin innebär."},
styrning:{p:[
"RF 1 kap. 1 §: <b>”All offentlig makt i Sverige utgår från folket.”</b> Sverige har ett demokratiskt styrelseskick som är <span class=hl>representativt</span> och <span class=hl>parlamentariskt</span>.",
"<b>Representativt</b>: de 349 ledamöterna i riksdagen är folkvalda representanter. Vi har en <span class=hl>folkrepresentation</span>. <b>Parlamentariskt</b>: regeringen måste ha riksdagens förtroende, och en majoritet i riksdagen kan alltid tvinga en regering att avgå.",
"Vi har <b>allmän och lika rösträtt</b>: alla röster är lika mycket värda och alla myndiga medborgare (18 år) får rösta. Val till riksdag, region- och kommunfullmäktige hålls vart fjärde år vid samma tillfälle. Bara svenska medborgare (även utlandsboende) får rösta i riksdagsvalet. Alla som är bosatta i landet får rösta i region- och kommunvalen.",
"<span class=hl>Regioner</span> (tidigare landsting) sköter det som inte passar att varje kommun gör själv, till exempel sjukvård och kollektivtrafik. <span class=hl>Kommuner</span> har kommunalt självstyre och sköter till exempel skola, barnomsorg, äldreomsorg, vatten och renhållning. Sverige har 290 kommuner.",
"RF 1 kap. 2 §: den offentliga makten ska utövas med respekt för <b>alla människors lika värde</b> och den enskilda människans frihet och värdighet. Det är kärnan i den svenska samhällsmodellen.",
"<b>Riksdagen – <span class=hl>den lagstiftande makten</span></b> (RF 1 kap. 4 §): stiftar lag, beslutar om skatt och hur statens pengar ska användas, och granskar regeringen. Den kontrollerar också att <span class=hl>skattepengarna</span> används som det är beslutat i statsbudgeten.",
"<b>Regeringen – <span class=hl>den verkställande makten</span></b> (RF 1 kap. 6 §): ”Regeringen styr riket. Den är ansvarig inför riksdagen.” Regeringen genomför riksdagens beslut, ger myndigheterna resurser och instruktioner och kan utfärda förordningar med riksdagens bemyndigande.",
"<span class=hl>Riksdagens talman</span> har landets högsta valbara ämbete och leder riksdagens arbete. Talmannen föreslår statsminister, riksdagen röstar, och om det inte finns en majoritet emot blir personen statsminister. Statsministern utser sedan ministrarna. Ministrarna är ansvariga inför riksdagen, som kan avsätta en minister genom en <span class=hl>förtroendeomröstning</span>.",
"<b>Domstolarna – <span class=hl>den dömande makten</span></b> (RF 1 kap. 8 §): de allmänna domstolarna, förvaltningsdomstolarna och specialdomstolarna.",
"Myndigheter verkställer lagarna och är självständiga i enskilda ärenden; ministerstyre är förbjudet. Statschefen, kungen, har ceremoniella uppgifter men ingen politisk makt."],
tip:"Kunna förklara representativt och parlamentariskt styrelseskick, och koppla lagstiftande, verkställande och dömande makt till rätt organ."},
rattigheter:{p:[
"Fri- och rättigheterna finns i <b>RF 2 kap. 1 §</b>. Var och en är gentemot det allmänna tillförsäkrad:",
"1. <span class=hl>Yttrandefrihet</span>: frihet att i tal, skrift, bild eller på annat sätt meddela upplysningar och uttrycka tankar, åsikter och känslor.<br>2. <span class=hl>Informationsfrihet</span>: frihet att inhämta och ta emot upplysningar och ta del av andras yttranden.<br>3. <span class=hl>Mötesfrihet</span>: frihet att anordna och delta i sammankomster för upplysning, meningsyttring eller för att framföra konstnärliga verk.<br>4. <span class=hl>Demonstrationsfrihet</span>: frihet att anordna och delta i demonstrationer på allmän plats.<br>5. <span class=hl>Föreningsfrihet</span>: frihet att sammansluta sig med andra för allmänna eller enskilda syften.<br>6. <span class=hl>Religionsfrihet</span>: frihet att ensam eller tillsammans med andra utöva sin religion.",
"Sverige följer också <span class=hl>Europakonventionen (EKMR)</span>, som är svensk lag sedan 1995. Ingen lag får strida mot EKMR (RF 2 kap. 19 §).",
"<span class=hl>Absoluta rättigheter</span> får inte begränsas, inte ens genom lag. Exempel: religionsfrihet, förbud mot dödsstraff, tortyr och kroppsstraff, skydd mot att tvingas berätta om sin politiska eller religiösa åsikt, och förbud mot att straffa någon i efterhand.",
"<span class=hl>Relativa rättigheter</span> får begränsas genom lag, men bara för ändamål som godtas i ett demokratiskt samhälle, aldrig mer än nödvändigt och aldrig så att den fria åsiktsbildningen hotas (RF 2 kap. 21 §). Exempel: yttrandefrihet, informationsfrihet, mötesfrihet, demonstrationsfrihet och föreningsfrihet.",
"<b>Exempel:</b> Yttrandefriheten begränsas av att hets mot folkgrupp och förtal är brott. Demonstrationsfriheten kan begränsas av hänsyn till ordning och säkerhet.",
"<b>Vad innebär skillnaden?</b> En absolut rättighet är ett totalt skydd: staten får aldrig göra så. En relativ rättighet är en avvägning mellan individens frihet och andra människors rättigheter eller samhällets säkerhet."],
tip:"Kunna de sex friheterna i RF 2:1 med förklaring, och sortera rättigheter i absoluta och relativa."},
lagstiftning:{p:[
"1. <b>Initiativ.</b> Ett problem uppmärksammas, till exempel av regeringen, en riksdagsledamot, organisationer, media eller medborgare.",
"2. <b>Kommittédirektiv.</b> Regeringen bestämmer vad som ska utredas.",
"3. <b>Utredning.</b> Resultatet blir ofta en <span class=hl>SOU</span> (Statens offentliga utredningar) eller en Ds.",
"4. <b>Remiss.</b> Förslaget skickas till myndigheter, organisationer och andra som får lämna synpunkter.",
"5. <b>Lagrådet</b> granskar förslaget juridiskt.",
"6. <b>Proposition.</b> Regeringen lämnar sitt lagförslag till riksdagen. Ledamöter kan lämna <span class=hl>motioner</span> med motförslag.",
"7. <b>Utskott.</b> Ett riksdagsutskott bereder ärendet och skriver ett <span class=hl>betänkande</span>.",
"8. <b>Beslut.</b> Riksdagen debatterar och röstar.",
"9. <b>Kungörelse.</b> Regeringen utfärdar lagen, som publiceras i <span class=hl>Svensk författningssamling (SFS)</span> och träder i kraft."],
tip:"Kunna stegen i ordning och förklara orden proposition, motion, remiss, utskott och betänkande."},
tvingande:{p:[
"En <span class=hl>tvingande lag</span> går inte att avtala bort. Den gäller oavsett vad parterna kommer överens om. Ofta skyddar den den svagare parten. Exempel: konsumentköplagen när en konsument köper av ett företag, hyresgästens skydd i hyreslagen och ångerrätten vid näthandel.",
"En <span class=hl>dispositiv lag</span> gäller bara om parterna inte har avtalat något annat. Exempel: köplagen när två privatpersoner eller två företag handlar med varandra.",
"<b>Varför behövs det?</b> Tvingande regler skyddar den som är i underläge, till exempel en konsument mot ett stort företag. Dispositiva regler respekterar <span class=hl>avtalsfriheten</span> men fyller luckor när parterna inte har kommit överens om allt, så att det ändå finns en regel att gå efter."],
tip:"Typfråga: ”Varför behövs tvingande lagar?” Svar: skydda den svagare parten."},
allmanna:{p:[
"De allmänna domstolarna har tre instanser: <span class=hl>tingsrätt</span>, <span class=hl>hovrätten</span> och <span class=hl>Högsta domstolen (HD)</span>.",
"<b>Hovrätten</b> är andra instans för mål från tingsrätten. Det finns sex hovrätter. Vid överklagande bedömer hovrätten om <span class=hl>prövningstillstånd</span> behövs. I brottmål behövs inget prövningstillstånd om mer än sex månaders fängelse finns i straffskalan. Annars kan det krävas. Det beviljas om hovrätten ifrågasätter tingsrättens dom eller om domen kan bli vägledande.",
"<b>Högsta domstolen</b> tar bara upp mål som är av betydelse för rättstillämpningen och som får prövningstillstånd, till exempel hur en ny lag ska tolkas. Domen blir då ett <span class=hl>prejudikat</span>, en vägledning för framtida domar. Det räcker inte att vara missnöjd med hovrättens dom, och relativt få får prövningstillstånd.",
"<b>Mål och ärenden:</b> <span class=hl>brottmål</span> där åklagaren för talan mot den som misstänks för brott, <span class=hl>tvistemål</span> där två parter tvistar (avtal, skulder, skadestånd, vårdnad), och <span class=hl>domstolsärenden</span> som adoption och god man.",
"Domstolarnas arbete styrs av <span class=hl>rättegångsbalken (RB)</span> och av regler i regeringsformen.",
"<b>Principer vid en huvudförhandling (s. 36–37):</b>",
"<b>Legalitetsprincipen</b>: inget straff utan lag och inget brott utan lag. Ingen får dömas utan stöd i lag (RF och brottsbalken).<br><b>Objektivitetsprincipen</b>: domstolar och myndigheter ska vara sakliga och opartiska; alla behandlas lika inför lagen.<br><b>Muntlighetsprincipen</b>: utredningar och bevis presenteras muntligt vid rättegången.<br><b>Omedelbarhetsprincipen</b>: domen ska bara grundas på det som tas upp under rättegången.<br><b>Koncentrationsprincipen</b>: rättegången ska vara sammanhängande och inte utdragen över tid.<br><b>Offentlighetsprincipen</b>: vem som helst får närvara vid en rättegång och ta del av handlingarna.<br><b>Oskuldspresumtion</b>: den tilltalade är oskyldig tills skulden är bevisad.",
"Ibland hålls rättegången bakom <span class=hl>lyckta eller stängda dörrar</span>, när målet gäller särskilt känsliga uppgifter. Då får allmänheten inte vara med."],
tip:"Kunna alla sju principerna från s. 36–37 och förklara dem med egna ord, samt när prövningstillstånd behövs."},
forvaltning:{p:[
"Den som är missnöjd med ett myndighetsbeslut kan överklaga till en <span class=hl>förvaltningsdomstol</span>. Både privatpersoner och företag kan överklaga.",
"Förvaltningsdomstolarna är <b>förvaltningsrätten</b>, <b>kammarrätten</b> och <b>Högsta förvaltningsdomstolen (HFD)</b>.",
"Exempel på mål: nekad sjukpenning (Försäkringskassan), skatt (Skatteverket), ekonomiskt bistånd från kommunen, återkallat körkort, tvångsvård som LVU och LVM, och migrationsmål. Boken nämner också att man vänder sig hit om man nekats bygglov eller vill överklaga något annat myndighetsbeslut."],
tip:"Tumregel: missnöjd med en myndighet → förvaltningsdomstol. Brott eller tvist mellan privatpersoner → allmän domstol."},
norm:{p:[
"En <span class=hl>norm</span> är en regel för hur man bör bete sig, ofta oskriven. Exempel: att hälsa, inte tränga sig i kön. Bryter man mot en norm blir reaktionen social, som att andra blir irriterade.",
"En <span class=hl>lag</span> är en skriven regel som beslutats av riksdagen. Den gäller alla, och staten upprätthåller den med <span class=hl>sanktioner</span> som böter eller fängelse.",
"Normer och lagar påverkar varandra. Lagar bygger ofta på normer, och ibland ändras en lag när normerna ändras. Exempel: aga mot barn förbjöds 1979."],
tip:"Nyckeln är vem som bestämt regeln och vad som händer om man bryter mot den."},
rattssakerhet:{p:[
"<span class=hl>Rättsmedvetande</span> är människors uppfattning om vad som är rätt och fel och vad som är rättvist, och deras kunskap om lagarna. Om lagarna stämmer med folks rättsmedvetande följs de oftare.",
"<span class=hl>Rättssäkerhet</span> betyder att rättsväsendet fungerar förutsebart och rättvist: lagarna är tydliga och offentliga, alla behandlas lika, ingen straffas utan lag och bevis, man har rätt till försvar och att överklaga, och domstolarna är opartiska.",
"Rättssäkerhet skyddar den enskilda mot godtycke. Rättsmedvetande gör att lagarna får stöd och respekt."],
tip:"Kunna skilja på dem: rättsmedvetande finns i människors huvuden, rättssäkerhet handlar om hur systemet fungerar."},
irac:{p:[
"IRAC är en metod för att lösa ett juridiskt problem steg för steg:",
"<b>I – Issue (fråga).</b> Vad är den juridiska frågan? Formulera den som en fråga.",
"<b>R – Rule (regel).</b> Vilken lag eller regel gäller? Ange lagen och vad den säger.",
"<b>A – Application/Analysis (tillämpning).</b> Använd regeln på fakta i fallet. Vad talar för och emot?",
"<b>C – Conclusion (slutsats).</b> Svara på frågan: hur blir det?",
"Öva i IRAC-verkstaden. Skriv själv först och jämför sedan med modellsvaret."],
tip:"Ett bra A-steg kopplar varje del av regeln till en fakta i fallet."},
rattskallor:{p:[
"<span class=hl>Rättskällor</span> är det domare och jurister använder för att avgöra vad som gäller. De har olika tyngd:",
"<b>Lagen</b> (författningar) väger tyngst.",
"<span class=hl>Förarbeten</span>: dokument från lagstiftningsprocessen, som SOU och proposition. De visar vad lagstiftaren ville uppnå med lagen.",
"<span class=hl>Prejudikat</span>: ett avgörande från högsta instans (HD eller HFD) som blir vägledande för hur liknande fall ska dömas.",
"<span class=hl>Praxis</span>: hur domstolar (och myndigheter) brukar döma och besluta över tid. Prejudikat är en del av rättspraxis.",
"<span class=hl>Sedvana</span>: handlingsmönster som tillämpats länge och uppfattas som bindande, till exempel inom handel.",
"<span class=hl>Doktrin</span>: rättsvetenskaplig litteratur, alltså juristers och forskares analyser av rätten."],
tip:"Skillnad prejudikat/praxis: ett prejudikat är ETT vägledande avgörande från högsta instans; praxis är det samlade mönstret av avgöranden."}
};

const view=document.getElementById("view"),nav=document.getElementById("nav");
const tname=id=>(TOPICS.find(t=>t.id===id)||{}).name||id;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chips(list,active,fn){return `<div class="chips" role="group">${list.map(([id,n])=>`<button class="chip" aria-pressed="${id===active}" data-chip="${id}">${esc(n)}</button>`).join("")}</div>`}
function bindChips(fn){view.querySelectorAll("[data-chip]").forEach(b=>b.onclick=()=>fn(b.dataset.chip))}
function mastery(id){
  const qs=QUIZ.filter(q=>q.topic===id);let r=0,t=0;
  qs.forEach(q=>{const s=S.quiz[q.q];if(s){r+=s.r;t+=s.r+s.w}});
  const cs=TERMS.filter(c=>c.topic===id);const known=cs.filter(c=>S.cards[c.t]===2).length;
  const parts=[];if(t)parts.push(r/t);if(cs.length)parts.push(known/cs.length);
  return parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100):0;
}

let cd=null;
function vCards(topic){
  topic=topic||"all";
  const pool=TERMS.filter(c=>topic==="all"||(topic==="book"?c.book:c.topic===topic));
  const rank=c=>({0:0,undefined:1,1:1,2:3})[S.cards[c.t]];
  const deck=shuffle(pool).sort((a,b)=>rank(a)-rank(b));
  cd={deck,i:0,flip:false,topic};renderCard();
}
function renderCard(){
  const tops=[["all","Alla"],["book","Rödmarkerat i boken"],...TOPICS.filter(t=>TERMS.some(c=>c.topic===t.id)).map(t=>[t.id,t.name])];
  const pool=cd.deck,known=pool.filter(c=>S.cards[c.t]===2).length;
  if(cd.i>=pool.length){view.innerHTML=chips(tops,cd.topic)+`<h2>Bra jobbat!</h2><p>Du har gått igenom alla ${pool.length} kort. ${known} markerade som ”Kan”.</p><button class="btn" id="again">Kör igen</button>`;bindChips(vCards);document.getElementById("again").onclick=()=>vCards(cd.topic);return}
  const c=pool[cd.i];
  view.innerHTML=chips(tops,cd.topic)+`
  <p class="muted">Kort ${cd.i+1} av ${pool.length} · ${known} kan du</p>
  <button class="card" id="card" aria-live="polite">${cd.flip?`<div class="def">${esc(c.d)}</div><div class="ex">${esc(c.t)} · ${esc(tname(c.topic))}</div>`:`${c.book?`<div class="badge">Rödmarkerat i boken</div>`:""}<div class="term"><span>${esc(c.t)}</span></div><div class="hint">Tryck eller mellanslag för att vända</div>`}</button>
  ${cd.flip?`<div class="rate"><button class="r0" data-r="0">Kan inte</button><button data-r="1">Osäker</button><button class="r2" data-r="2">Kan</button></div>`:`<div class="rate"><button disabled style="opacity:.4">Kan inte</button><button disabled style="opacity:.4">Osäker</button><button disabled style="opacity:.4">Kan</button></div>`}`;
  bindChips(vCards);
  document.getElementById("card").onclick=()=>{cd.flip=!cd.flip;renderCard()};
  view.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>rate(+b.dataset.r));
}
function rate(r){const c=cd.deck[cd.i];S.cards[c.t]=r;save();if(r===0&&cd.deck.length-cd.i>3)cd.deck.splice(cd.i+3,0,c);cd.i++;cd.flip=false;renderCard()}
document.addEventListener("keydown",e=>{if(mode!=="begrepp"||!cd||e.target.tagName==="TEXTAREA")return;
  if(e.key===" "){e.preventDefault();cd.flip=!cd.flip;renderCard()}
  else if(cd.flip&&["1","2","3"].includes(e.key))rate(+e.key-1)});

let qz=null;
function vQuizStart(topic){
  topic=topic||"all";
  const tops=[["all","Alla områden"],...TOPICS.filter(t=>QUIZ.some(q=>q.topic===t.id)).map(t=>[t.id,t.name])];

  bindChips(vQuizStart);document.getElementById("go").onclick=()=>startQuiz(topic,10,false);

function startQuiz(topic,n,exam){
  mode=exam?"prov":"quiz";
  nav.querySelectorAll("button").forEach(b=>b.setAttribute("aria-current",b.dataset.m===mode));
  const pool=shuffle(QUIZ.filter(q=>topic==="all"||q.topic===topic)).slice(0,n);
  qz={list:pool.map(q=>{const order=shuffle(q.a.map((_,i)=>i));return{...q,order}}),i:0,score:0,res:[],exam,topic};renderQ();
}
function renderQ(){
  const q=qz.list[qz.i];
  view.innerHTML=`<div class="progress"><i style="width:${qz.i/qz.list.length*100}%"></i></div>
  <p class="muted">Fråga ${qz.i+1} av ${qz.list.length} · ${esc(tname(q.topic))}</p>
  <h2>${esc(q.q)}</h2><div id="opts">${q.order.map(i=>`<button class="opt" data-i="${i}">${esc(q.a[i])}</button>`).join("")}</div><div id="fb"></div>`;
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
  const q=qz.list[qz.i],ok=i===q.c;
  view.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const k=+b.dataset.i;if(k===q.c)b.classList.add("right");else if(k===i)b.classList.add("wrong")});
  const s=S.quiz[q.q]||{r:0,w:0};ok?s.r++:s.w++;S.quiz[q.q]=s;save();
  if(ok)qz.score++;qz.res.push({topic:q.topic,ok});
  document.getElementById("fb").innerHTML=`<div class="why"><b>${ok?"Rätt!":"Inte riktigt."}</b> ${q.why?esc(q.why):(ok?"":"Rätt svar: "+esc(q.a[q.c])+".")}</div>
  <button class="btn" id="next">${qz.i+1<qz.list.length?"Nästa fråga":"Se resultat"}</button>`;
  const nx=document.getElementById("next");nx.focus();nx.onclick=()=>{qz.i++;qz.i<qz.list.length?renderQ():renderResult()};
}
function renderResult(){
  const by={};qz.res.forEach(r=>{by[r.topic]=by[r.topic]||{r:0,t:0};by[r.topic].t++;if(r.ok)by[r.topic].r++});
  const weak=Object.entries(by).filter(([,v])=>v.r/v.t<.7).map(([k])=>k);
  view.innerHTML=`<h2>${qz.exam?"Provresultat":"Resultat"}</h2>
  <p><span class="big">${qz.score}</span> <span class="muted">av ${qz.list.length} rätt</span></p>
  ${qz.exam||Object.keys(by).length>1?`<table><thead><tr><th>Område</th><th>Rätt</th></tr></thead><tbody>${Object.entries(by).map(([k,v])=>`<tr><td>${esc(tname(k))}</td><td>${v.r} / ${v.t}</td></tr>`).join("")}</tbody></table>`:""}
  ${weak.length?`<div class="tip"><strong>Läs på extra:</strong> ${weak.map(k=>`<button class="chip" data-w="${k}">${esc(tname(k))}</button>`).join(" ")}</div>`:`<p>Snyggt, inga svaga områden den här gången.</p>`}
  <div class="row"><button class="btn" id="again">${qz.exam?"Nytt prov":"Ny omgång"}</button><button class="btn ghost" id="home">Till översikten</button></div>`;
  view.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>go("las",b.dataset.w));
  document.getElementById("again").onclick=()=>qz.exam?go("prov"):startQuiz(qz.topic,10,false);
  document.getElementById("home").onclick=()=>go("oversikt");
}

function vSortList(topic){

  const lbl={order:"Ordna i rätt ordning",buckets:"Sortera i grupper",match:"Para ihop"};
  view.innerHTML=`<h2>Sortera och para ihop</h2>${topic?`<p><button class="chip" id="all">Visa alla övningar</button></p>`:""}
  <div class="list">${list.map(s=>`<button class="item" data-s="${s.id}">${esc(s.title)}<small>${lbl[s.type]} · ${esc(tname(s.topic))}</small></button>`).join("")}</div>`;
  const a=document.getElementById("all");if(a)a.onclick=()=>vSortList();
  view.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>openSort(SORTS.find(s=>s.id===b.dataset.s)));
}
function sortHead(s){return `<p><button class="chip" id="back">Alla övningar</button></p><h2>${esc(s.title)}</h2>`}
function openSort(s){({order:sOrder,buckets:sBuckets,match:sMatch})[s.type](s)}
function sOrder(s){
  let arr=shuffle(s.items);if(arr.join()===s.items.join())arr=arr.reverse();let checked=false;
  const draw=()=>{view.innerHTML=sortHead(s)+`<p class="muted">Flytta raderna med pilarna.</p>
  ${arr.map((t,i)=>`<div class="ord ${checked?(t===s.items[i]?"right":"wrong"):""}"><span class="n">${i+1}</span><span class="t">${esc(t)}</span><button aria-label="Flytta upp" data-u="${i}">↑</button><button aria-label="Flytta ner" data-d="${i}">↓</button></div>`).join("")}
  <div class="row" style="margin-top:14px"><button class="btn" id="chk">Rätta</button><button class="btn ghost" id="sol">Visa facit</button><button class="btn ghost" id="rs">Blanda om</button></div><p id="msg" style="margin-top:12px"></p>`;
  view.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const i=+b.dataset.u;if(i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];checked=false;draw()}});
  view.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const i=+b.dataset.d;if(i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];checked=false;draw()}});
  document.getElementById("chk").onclick=()=>{checked=true;draw();const n=arr.filter((t,i)=>t===s.items[i]).length;document.getElementById("msg").textContent=n===arr.length?"Helt rätt!":`${n} av ${arr.length} på rätt plats.`};
  document.getElementById("sol").onclick=()=>{arr=s.items.slice();checked=true;draw()};
  document.getElementById("rs").onclick=()=>sOrder(s);
  document.getElementById("back").onclick=()=>vSortList();};draw();
}
function sBuckets(s){
  const names=Object.keys(s.buckets),ans={};names.forEach(b=>s.buckets[b].forEach(t=>ans[t]=b));
  const items=shuffle(Object.keys(ans));const place={};let sel=null,checked=false;
  const draw=()=>{const pool=items.filter(t=>!place[t]);
  view.innerHTML=sortHead(s)+`<p class="muted">Tryck på ett påstående och sedan på rätt grupp. Tryck på ett placerat påstående för att flytta tillbaka det.</p>
  <div class="pool">${pool.length?pool.map(t=>`<button class="tok ${sel===t?"sel":""}" data-p="${esc(t)}">${esc(t)}</button>`).join(""):`<span class="muted">Alla placerade. Tryck på Rätta.</span>`}</div>
  <div class="buckets">${names.map(b=>`<div class="bucket ${sel?"target":""}" data-b="${esc(b)}" role="button" tabindex="0"><b>${esc(b)}</b>${items.filter(t=>place[t]===b).map(t=>`<button class="tok ${checked?(ans[t]===b?"right":"wrong"):""}" data-x="${esc(t)}">${esc(t)}</button>`).join("")}</div>`).join("")}</div>
  <div class="row"><button class="btn" id="chk">Rätta</button><button class="btn ghost" id="sol">Visa facit</button><button class="btn ghost" id="rs">Börja om</button></div><p id="msg" style="margin-top:12px"></p>`;
  view.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{sel=sel===b.dataset.p?null:b.dataset.p;draw()});
  view.querySelectorAll("[data-b]").forEach(b=>{const f=()=>{if(sel){place[sel]=b.dataset.b;sel=null;checked=false;draw()}};b.onclick=f;b.onkeydown=e=>{if(e.key==="Enter")f()}});
  view.querySelectorAll("[data-x]").forEach(b=>b.onclick=e=>{e.stopPropagation();delete place[b.dataset.x];checked=false;draw()});
  document.getElementById("chk").onclick=()=>{checked=true;draw();const placed=items.filter(t=>place[t]);const n=placed.filter(t=>place[t]===ans[t]).length;document.getElementById("msg").textContent=`${n} av ${items.length} rätt${placed.length<items.length?` (${items.length-placed.length} kvar att placera)`:""}.`};
  document.getElementById("sol").onclick=()=>{items.forEach(t=>place[t]=ans[t]);checked=true;sel=null;draw()};
  document.getElementById("rs").onclick=()=>sBuckets(s);
  document.getElementById("back").onclick=()=>vSortList();};draw();
}
function sMatch(s){
  const opts=shuffle(s.pairs.map(p=>p[1]));const pick={};let checked=false;
  const draw=()=>{view.innerHTML=sortHead(s)+`<p class="muted">Välj rätt beskrivning till varje begrepp.</p>
  ${s.pairs.map(([l,r],i)=>`<div class="match ${checked?(pick[i]===r?"right":"wrong"):""}"><b>${esc(l)}</b><select data-i="${i}"><option value="">Välj…</option>${opts.map(o=>`<option ${pick[i]===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`).join("")}
  <div class="row" style="margin-top:14px"><button class="btn" id="chk">Rätta</button><button class="btn ghost" id="sol">Visa facit</button></div><p id="msg" style="margin-top:12px"></p>`;
  view.querySelectorAll("select").forEach(x=>x.onchange=()=>{pick[x.dataset.i]=x.value;checked=false;x.parentElement.classList.remove("right","wrong")});
  document.getElementById("chk").onclick=()=>{checked=true;draw();const n=s.pairs.filter((p,i)=>pick[i]===p[1]).length;document.getElementById("msg").textContent=n===s.pairs.length?"Helt rätt!":`${n} av ${s.pairs.length} rätt.`};
  document.getElementById("sol").onclick=()=>{s.pairs.forEach((p,i)=>pick[i]=p[1]);checked=true;draw()};
  document.getElementById("back").onclick=()=>vSortList();};draw();
}

/* ===================== IRAC ===================== */
function vIrac(ci){
  ci=+ci||0;const c=CASES[ci];
  view.innerHTML=`<h2>IRAC-verkstaden</h2>
  <div class="irac"><b>I</b><span><b>Issue</b> – vad är den juridiska frågan?</span><b>R</b><span><b>Rule</b> – vilken regel gäller?</span><b>A</b><span><b>Application</b> – tillämpa regeln på fakta i fallet</span><b>C</b><span><b>Conclusion</b> – hur blir det?</span></div>
  ${chips(CASES.map((x,i)=>[String(i),x.title]),String(ci))}
  <div class="case"><b>${esc(c.title)}</b><br>${esc(c.text)}</div>
  <div id="steps">${IRACL.map((l,i)=>`<div class="step"><div class="lbl">${esc(l)}</div><textarea aria-label="${esc(l)}"></textarea><div class="model"><b>Modellsvar:</b> ${esc(c.m[i])}</div></div>`).join("")}</div>
  <div class="row"><button class="btn" id="show">Visa modellsvar</button></div>
  <p class="muted" style="margin-top:14px">Jämför: fick du med rätt lag? Kopplade du varje del av regeln till något i fallet?</p>`;
  bindChips(i=>vIrac(i));
  document.getElementById("show").onclick=e=>{document.getElementById("steps").classList.add("show");e.target.remove()};
}

go("oversikt");
</script>
</body>
